name: SonarQube Cloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: Build, test y análisis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      # Actualización debido a un error que me mostro en actions.
      # Pruebas: angular.json no define un target "test" (el proyecto no tiene
      # pruebas unitarias configuradas), por eso solo se compila antes del análisis.

      - name: Compilar
        run: npm run build

      - name: Análisis SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
